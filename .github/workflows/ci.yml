name: Tests
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Refresh apt package lists
        # The runner image's cached lists can point at superseded
        # package versions, making apt 404 while installing Crystal's
        # dependencies (libevent-dev et al); refreshing resolves them
        if: runner.os == 'Linux'
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Run tests
        run: |
          shards install --without-development
          crystal tool format --check
          crystal spec -v
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Refresh apt package lists
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
      - name: Lint Crystal
        run: |
          shards install
          mkdir -p bin
          crystal build lib/ameba/bin/ameba.cr -o bin/ameba
          bin/ameba
      - name: Lint markdown
        run: npx -y markdownlint-cli2@0.23.2
