name: croupier
version: 0.16.0
description: A smart task definition and execution library
authors:
  - Roberto Alsina <roberto.alsina@gmail.com>

crystal: 1.20.0

license: MIT

dependencies:
  inotify:
    github: petoem/inotify.cr
